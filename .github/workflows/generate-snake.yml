# .github/workflows/generate-snake.yml
#
# Generates an animated SVG of a "snake" eating your contribution graph,
# using the Platane/snk Action. Fully self-contained: it reads your public
# contribution data and commits the SVG to an "output" branch of this same
# repo. No third-party live server is involved, so it can't go down the
# way the Vercel-based card services have.
#
# Runs daily and on demand from the Actions tab.

name: Generate Contribution Snake

on:
  schedule:
    - cron: '0 4 * * *' # daily at 04:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate snake animation SVG
        uses: Platane/snk@v3
        with:
          github_user_name: shashiazad
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push output to the "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}